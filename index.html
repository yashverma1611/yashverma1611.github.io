<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>See Your Best Version</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0b10;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.5);
      --accent-gradient: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient background gradient glows */
    .glow-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      pointer-events: none;
      transition: all 1s ease;
    }
    .glow-orb-1 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.28), transparent 70%);
      top: 10%;
      left: 15%;
    }
    .glow-orb-2 {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.25), transparent 70%);
      bottom: 12%;
      right: 15%;
    }

    /* Container Card */
    .container {
      position: relative;
      z-index: 1;
      max-width: 600px;
      width: 90%;
      margin: 2rem auto;
      text-align: center;
      padding: 3.5rem 2.25rem;
      border-radius: 32px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      box-shadow: 0 25px 65px -15px rgba(0, 0, 0, 0.7);
      transition: transform 0.4s ease, border-color 0.4s ease;
    }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 1.1rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      margin-bottom: 1.75rem;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      background: #818cf8;
      border-radius: 50%;
      box-shadow: 0 0 10px #818cf8;
      animation: blink 1.8s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Typography */
    h1 {
      font-size: clamp(2rem, 5vw, 2.75rem);
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 1.25rem;
      letter-spacing: -0.02em;
    }

    .gradient-text {
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      font-size: 1.125rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 2.75rem;
    }

    /* Camera Viewfinder frame */
    .camera-frame {
      position: relative;
      width: 170px;
      height: 170px;
      margin: 0 auto 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Corner Marks */
    .corner {
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: rgba(255, 255, 255, 0.35);
      pointer-events: none;
      transition: all 0.3s ease;
    }
    .corner-tl { top: 0; left: 0; border-top: 2px solid; border-left: 2px solid; }
    .corner-tr { top: 0; right: 0; border-top: 2px solid; border-right: 2px solid; }
    .corner-bl { bottom: 0; left: 0; border-bottom: 2px solid; border-left: 2px solid; }
    .corner-br { bottom: 0; right: 0; border-bottom: 2px solid; border-right: 2px solid; }

    .camera-frame:hover .corner {
      border-color: #a855f7;
      transform: scale(1.12);
    }

    /* Shutter Button */
    .camera-btn {
      position: relative;
      width: 112px;
      height: 112px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 12px 35px var(--accent-glow);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
      outline: none;
    }

    .camera-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 16px 45px rgba(168, 85, 247, 0.65);
    }

    .camera-btn:active {
      transform: scale(0.92);
    }

    /* Pulse wave ring */
    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(168, 85, 247, 0.6);
      top: 0;
      left: 0;
      animation: pulse 2.2s infinite ease-out;
      pointer-events: none;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 0.8;
      }
      100% {
        transform: scale(1.55);
        opacity: 0;
      }
    }

    .camera-btn svg {
      width: 50px;
      height: 50px;
      transition: transform 0.25s ease;
    }

    .camera-btn:hover svg {
      transform: scale(1.1);
    }

    .hint {
      font-size: 0.9rem;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    /* White Flash Overlay */
    .flash-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      z-index: 99999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease-out;
    }
    .flash-overlay.active {
      opacity: 1;
    }

    /* Output Reveal Screen */
    .reveal-view {
      display: none;
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .reveal-view.show {
      display: block;
      opacity: 1;
      transform: scale(1);
    }

    .reveal-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.75rem;
      border-radius: 50%;
      background: rgba(236, 72, 153, 0.15);
      border: 1px solid rgba(236, 72, 153, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.25rem;
      box-shadow: 0 0 40px rgba(236, 72, 153, 0.3);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .reveal-title {
      font-size: clamp(2rem, 5vw, 2.75rem);
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 1.25rem;
      background: linear-gradient(135deg, #f472b6, #fb7185, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .reveal-desc {
      font-size: 1.35rem;
      font-weight: 500;
      color: #f1f5f9;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }

    .reset-btn {
      padding: 0.85rem 1.85rem;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      color: #e2e8f0;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .reset-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.35);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Background Orbs -->
  <div class="glow-orb glow-orb-1"></div>
  <div class="glow-orb glow-orb-2"></div>

  <!-- Camera Flash Overlay -->
  <div class="flash-overlay" id="flashOverlay"></div>

  <!-- Main Card -->
  <div class="container" id="mainContainer">

    <!-- INITIAL STATE: Camera Button & Intro -->
    <div id="initialView">
      <div class="badge">
        <span class="badge-dot"></span> Instant Portrait Mirror
      </div>

      <h1>Tap camera button to see <br><span class="gradient-text">your best version</span></h1>
      
      <p class="subtitle">
        Ready to discover perfection? Press the shutter below to reveal who you truly are.
      </p>

      <!-- Camera viewfinder & trigger -->
      <div class="camera-frame">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>
        <div class="pulse-ring"></div>

        <button class="camera-btn" id="cameraBtn" title="Take picture" aria-label="Tap camera button to see your best version">
          <!-- Modern Camera SVG Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
            <circle cx="12" cy="13" r="3"/>
          </svg>
        </button>
      </div>

      <div class="hint">⚡ Click to capture & witness the masterpiece</div>
    </div>

    <!-- REVEAL STATE: The Output Message -->
    <div class="reveal-view" id="revealView">
      <div class="reveal-icon">🪞</div>
      <h1 class="reveal-title">✨ You're already looking at it!</h1>
      <p class="reveal-desc">
        Your best version is looking right into the screen right now.
      </p>
      <button class="reset-btn" id="resetBtn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        Take Another Look
      </button>
    </div>

  </div>

  <script>
    // Synthesize camera shutter sound using Web Audio API
    function playShutterSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const bufferSize = audioCtx.sampleRate * 0.09;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 900;

        const gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.09);

        whiteNoise.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        whiteNoise.start();
      } catch (e) {}
    }

    const cameraBtn = document.getElementById('cameraBtn');
    const flashOverlay = document.getElementById('flashOverlay');
    const initialView = document.getElementById('initialView');
    const revealView = document.getElementById('revealView');
    const resetBtn = document.getElementById('resetBtn');

    cameraBtn.addEventListener('click', () => {
      // 1. Play shutter sound
      playShutterSound();

      // 2. Camera flash effect
      flashOverlay.classList.add('active');

      setTimeout(() => {
        flashOverlay.classList.remove('active');

        // 3. Switch to output message view
        initialView.style.display = 'none';
        revealView.classList.add('show');
      }, 160);
    });

    // Reset button to test it again
    resetBtn.addEventListener('click', () => {
      revealView.classList.remove('show');
      initialView.style.display = 'block';
    });
  </script>
</body>
</html>
